# The Flutter template defaults to -Xmx8G, which the build machine here
# (and many laptops) cannot provide — the daemon was OOM-killed and the
# build failed with "Could not receive a message from the daemon".
# 2G is ample for this project.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 defaults to its new DSL, under which this project's
# android/app/build.gradle.kts (the stock Flutter template's `android {}`
# block and `kotlinOptions { jvmTarget }`) fails to compile. Opt out of
# the new DSL until that file is migrated to the AGP 9 DSL
# (ApplicationExtension + compilerOptions). The flag goes away in AGP 10.
android.newDsl=false
