# The Flutter template defaults to -Xmx8G, which the build machine here
# (and many laptops) cannot provide — the daemon was OOM-killed and the
# build failed with "Could not receive a message from the daemon".
# 2G is ample for this project.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
